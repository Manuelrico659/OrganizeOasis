name: Run Tests with Logs

on:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11.4'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests and save logs
      run: |
        mkdir -p logs
        pytest tests/unit/ > logs/unit-tests.log 2>&1
      continue-on-error: true

    - name: Run integration tests and save logs
      run: |
        mkdir -p logs
        pytest tests/integration/ > logs/integration-tests.log 2>&1
      continue-on-error: true

    - name: Run e2e tests and save logs
      run: |
        mkdir -p logs
        pytest tests/e2e/ > logs/e2e-tests.log 2>&1
      continue-on-error: true

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-logs
        path: logs/
        retention-days: 7
